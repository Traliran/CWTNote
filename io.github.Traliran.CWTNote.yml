app-id: io.github.Traliran.CWTNote
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: cwtnote

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home

modules:
  - name: git
    buildsystem: simple
    build-commands:
      - make -j"${FLATPAK_BUILDER_N_JOBS:-1}" prefix=/app gitexecdir=/app/libexec/git-core NO_CURL=1 NO_EXPAT=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 NO_RUST=1 NO_TCLTK=1 NO_OPENSSL=1 NO_INSTALL_HARDLINKS=1 install
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz
        sha256: 26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3

  - name: cwtnote
    buildsystem: simple
    build-commands:
      - make -j"${FLATPAK_BUILDER_N_JOBS:-1}"
      - make install PREFIX=/app
    sources:
      - type: git
        url: https://github.com/Traliran/CWTNote.git
        tag: 1.2.2
